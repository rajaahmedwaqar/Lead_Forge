<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeadForge | Find local business leads and send outreach</title>
    <meta name="description" content="LeadForge finds local businesses on Google Maps, collects their contact details, tracks your pipeline and helps you write and send personalised outreach emails." />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#0F6B5C" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LeadForge" />
    <meta property="og:title" content="LeadForge | Find local business leads and send outreach" />
    <meta property="og:description" content="Search Google Maps by keyword and city, build a lead pipeline and send personalised emails from one dashboard." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="LeadForge | Find local business leads" />
    <meta name="twitter:description" content="Search Google Maps by keyword and city, build a lead pipeline and send personalised emails." />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "LeadForge",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "Lead generation and outreach tool for local business prospecting."
      }
    </script>

    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      try {
        var t = localStorage.getItem('leadforge-theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <main style="font-family:system-ui,sans-serif;max-width:40rem;margin:4rem auto;padding:0 1rem">
        <h1>LeadForge</h1>
        <p>Find local businesses on Google Maps, collect contact details, track your pipeline and send personalised outreach emails.</p>
        <noscript><p>Please enable JavaScript to use LeadForge.</p></noscript>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
